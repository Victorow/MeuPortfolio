name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks only for what it needs.
permissions: {}

# Never two deploys at once; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      # Actions are pinned by full commit SHA (tag in the trailing comment); Dependabot keeps them current.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (lockfile only)
        run: npm ci

      # Gate: high/critical advisories in production dependencies fail the build.
      # Plain `npm audit --audit-level=high` cannot be used yet: every Next.js 14 release is flagged for
      # server-runtime advisories (middleware, image optimizer, server actions) that a static export does
      # not run. scripts/audit.mjs allow-lists only the `next` package and documents why.
      - name: Audit production dependencies
        run: npm run audit:prod

      # Informational: full tree including dev tooling (never shipped to the site).
      - name: Audit all dependencies (report only)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      # prebuild: strip PDF metadata, sitemap.xml, llms.txt, JSON-LD source check.
      # postbuild: validates the JSON-LD in the exported HTML.
      - name: Build static export
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # .nojekyll so GitHub Pages serves _next/ and .well-known/ as-is; CNAME for victors.codes.
      - name: Ensure .nojekyll and CNAME
        run: |
          touch out/.nojekyll
          echo "victors.codes" > out/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./out

  # Publishes exactly the artifact built above; nothing is rebuilt here.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
